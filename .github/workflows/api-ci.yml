name: API CI

on:
  push:
    branches: [Backend-API]
  pull_request:
    branches: [Backend-API, main]

jobs:
  api-tests:
    name: REST API type-check + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: localmiles-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localmiles-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run API tests
        run: npm test
