name: Android CI

on:
  # runs on every push to any branch, on tags and on pull requests
  push:
    branches: ['**']
    tags: ['**']
  pull_request:

jobs:
  build-and-test:
    name: App unit tests + debug build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: localmiles-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # signs the release APK only if the secrets are set (see docs/RELEASE.md)
      # if not, it builds unsigned which still shows the release build works
      - name: Decode signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCALMILES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LOCALMILES_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          LOCALMILES_KEYSTORE_PASSWORD: ${{ secrets.LOCALMILES_KEYSTORE_PASSWORD }}
          LOCALMILES_KEY_ALIAS: ${{ secrets.LOCALMILES_KEY_ALIAS }}
          LOCALMILES_KEY_PASSWORD: ${{ secrets.LOCALMILES_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: localmiles-release-apk
          path: app/build/outputs/apk/release/*.apk

  # The REST API lives on the Backend-API branch of this repo (localmiles-api/).
  # Testing it here means every app change is checked against the API's
  # status rules, auth middleware and request validation too.
  api-tests:
    name: REST API type-check + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: localmiles-api

    steps:
      - name: Checkout Backend-API branch
        uses: actions/checkout@v4
        with:
          ref: Backend-API

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localmiles-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run API tests
        run: npm test
